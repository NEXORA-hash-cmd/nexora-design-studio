<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#1A2333"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Subtle glow layer behind logo -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)" opacity="0.18" filter="url(#subtleGlow)"/>

  <!-- NEXORA Geometric Monogram 'N' with Business Block Matrix -->
  <g transform="translate(116, 116)">
    <!-- Left Pillar -->
    <path d="M 30,240 L 30,40 L 90,40 L 90,240 Z" fill="url(#accentGrad)" />
    
    <!-- Diagonal Dynamic Beam -->
    <path d="M 85,40 L 195,240 L 250,240 L 140,40 Z" fill="url(#glowGrad)" />

    <!-- Right Pillar -->
    <path d="M 190,40 L 250,40 L 250,240 L 190,240 Z" fill="#10B981" />

    <!-- Isometric Node Accents -->
    <circle cx="60" cy="40" r="14" fill="#38BDF8"/>
    <circle cx="220" cy="240" r="14" fill="#10B981"/>
    <circle cx="140" cy="140" r="11" fill="#FFFFFF"/>
    <line x1="60" y1="40" x2="220" y2="40" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-dasharray="6,6"/>
    <line x1="60" y1="240" x2="220" y2="240" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-dasharray="6,6"/>
  </g>
</svg>

    <script>
      (function() {
        function ensureWritableFetch(target) {
          try {
            if (!target) return;
            var current = target.fetch;
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (!desc || (!desc.set && !desc.writable)) {
              Object.defineProperty(target, 'fetch', {
                get: function() { return current; },
                set: function(fn) { current = fn; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e) {}
        }
        if (typeof window !== 'undefined') {
          ensureWritableFetch(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            ensureWritableFetch(Window.prototype);
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            ensureWritableFetch(globalThis);
          }
        }
      })();
